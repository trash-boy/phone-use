name: CI

on:
  push:
    branches: ["release-*"]

permissions:
  contents: read

# Only release branches publish. Serialize the entire run so an older build
# cannot deploy after a newer release; let an active deployment finish.
concurrency:
  group: release-vps-production
  cancel-in-progress: false

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 锁定工具链（与 Docker 构建镜像一致）：新版 clippy 的 lint 不会在代码没变时把 CI 弄挂
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # vendor/ 是上游代码，不格式化；只检查本仓库的包
      - name: fmt
        run: for p in ictl-l10n ictl-device ictl-wda ictl-sign ictl-unlock ictl-daemon ictl-mcp ictl-protocol iphone-control; do cargo fmt -p $p -- --check; done
      # --all-features：默认不编的 debug-cmds（调试子命令）也要能编译
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      # Software TCP regressions use synthetic transports; upstream TUN demos need root/devices.
      - name: software TCP cancellation and WAN timer regressions
        run: cargo test --locked --manifest-path vendor/jktcp/Cargo.toml --lib -- --skip tests::local_tcp --skip tests::handle_speed

  # macOS（Apple Silicon）上能编译、测试通过；格式和平台无关，上面已经查过
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-features：默认不编的 debug-cmds（调试子命令）也要能编译
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      # Software TCP regressions use synthetic transports; upstream TUN demos need root/devices.
      - name: software TCP cancellation and WAN timer regressions
        run: cargo test --locked --manifest-path vendor/jktcp/Cargo.toml --lib -- --skip tests::local_tcp --skip tests::handle_speed

  # Cargo.toml 声明的最低版本（rust-version）要真能编译
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  browser:
    uses: ./.github/workflows/browser.yml

  deployment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s deploy/tests -v

  release:
    needs: [rust, macos, msrv, secrets, browser, deployment-tests]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
