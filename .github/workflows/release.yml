name: Build and deploy VPS

on:
  workflow_call:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/trash-boy/phone-use

jobs:
  image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Count build CPUs
        id: cpus
        run: echo "jobs=$(nproc)" >> "$GITHUB_OUTPUT"
      - name: Build complete web and native image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: browser-control/Dockerfile
          platforms: linux/amd64
          build-args: |
            WEB_BASE=/iphone/
            CARGO_BUILD_JOBS=${{ steps.cpus.outputs.jobs }}
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web-vps-amd64
          cache-to: type=gha,mode=max,scope=web-vps-amd64
      - name: Smoke test the release image before publishing
        env:
          RELEASE_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: bash deploy/smoke-image.sh "$RELEASE_IMAGE"
      - name: Publish immutable image digest
        id: publish
        env:
          RELEASE_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$RELEASE_IMAGE"
          image=$(docker image inspect "$RELEASE_IMAGE" --format '{{index .RepoDigests 0}}')
          [[ "$image" =~ ^ghcr.io/trash-boy/phone-use@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: vps-production
      url: https://amazingly.top/iphone/
    steps:
      - uses: actions/checkout@v7
      - name: Configure dedicated SSH key and pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/vps-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/vps-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/vps-ssh/known_hosts"
      - name: Deploy exact digest and verify, with rollback on failure
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_IMAGE: ${{ needs.image.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # JSON travels on stdin; neither the token nor server config is an SSH argument.
          python3 - <<'PY' | ssh -T -i "$RUNNER_TEMP/vps-ssh/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vps-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$VPS_USER@$VPS_HOST"
          import json, os
          print(json.dumps({
              "image": os.environ["RELEASE_IMAGE"],
              "revision": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF_NAME"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "registryUser": os.environ["GITHUB_ACTOR"],
              "registryToken": os.environ["GH_TOKEN"],
          }))
          PY
      - name: Remove SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/vps-ssh"
