[package]
name = "ictl-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.23", features = ["csr"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
serde-wasm-bindgen = "=0.6.5"
futures-util = "=0.3.34"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "Element", "HtmlElement", "Event", "EventTarget", "AbortController", "AbortSignal", "Performance", "console", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlImageElement", "DomRect", "PointerEvent", "SubmitEvent", "Location", "File", "FileList", "Blob", "ClipboardEvent", "DataTransfer", "DragEvent"] }
